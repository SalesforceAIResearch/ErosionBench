[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erosionbench"
version = "1.1.0"
description = "ErosionBench: measuring alignment decay in multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Riya Bharathwaj" }]
keywords = ["ai-safety", "alignment", "multi-agent", "llm-security", "red-teaming", "agentic-ai"]

dependencies = [
  "anthropic>=0.40.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "openai>=1.40.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "fpdf2>=2.7.0",
  "pypdf>=4.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "httpx>=0.27.0",
  "huggingface_hub>=0.23.0",   # scripts/download_data.py fetches the dataset/corpus from the Hub
  "pyyaml>=5.3",               # agent_profiles.py (imported transitively today, declared for safety)
]

[project.optional-dependencies]
# Heavy/optional: local HF guard models, LlamaFirewall perimeter, analysis extras.
guards = ["llamafirewall>=1.0.0", "transformers>=4.40", "pandas>=2.0.0"]
# Mode B image rendering/OCR + dataset-regeneration helpers (not needed to run the Mode A text eval).
# NOTE: pytesseract also requires the system `tesseract` binary to be installed.
images = ["Pillow>=10.0.0", "pytesseract>=0.3.10", "datasets>=2.14.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
erosionbench-eval = "erosionbench.eval_pipeline.main:main"
erosionbench-sandbox = "erosionbench.sandbox.server:main"

[tool.setuptools.packages.find]
include = ["erosionbench*"]
exclude = ["tests*", "scripts*", "results*", "paper*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
